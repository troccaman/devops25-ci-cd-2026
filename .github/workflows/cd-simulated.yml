
name: CD - Simulated Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - cicd-projekt

jobs:
  deploy:
    name: Deploy and Verify
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        run: |
          docker pull \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      - name: Start application
        run: |
          docker run -d \
            --name devops25-app \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      - name: Verify deployment
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs devops25-app
          exit 1

      - name: Verify version
        run: |
          curl --fail --silent --show-error \
            http://localhost:8000/version | python3 -c \
            'import json,sys; data=json.load(sys.stdin); assert data["version"] == "1.1"'

      - name: Stop application
        if: always()
        run: docker rm -f devops25-app || true
